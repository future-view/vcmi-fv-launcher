[package]
name = "vcmi-fv-launcher"
version = "0.2.0"
description = "VCMI-FV-Launcher"
authors = ["FeatureView"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rayon = "1"
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
zip = { version = "2", default-features = false, features = ["deflate", "aes-crypto"] }
sha2 = "0.10"
flate2 = "1"
# 地图文本编码检测（h3m.rs）：GBK/Big5/CP932/CP949/CP125x 严格解码 + 转码
encoding_rs = "0.8"
# `dds`：H3 高清版（HD Edition）素材是 DXT1/DXT5 的 DDS 图集（见 infra/pak.rs、vcmi/hd_edition.rs）。
# 只加 feature 不引新 crate —— 自写 DXT 解码是备选方案（见 HD 素材接入方案）。
image = { version = "0.25.10", features = ["webp", "dds"] }
# 有损 WebP 编码：image 的 WebPEncoder 仅支持无损（VP8L），
# 图标类小图改由 libwebp 有损编码，耗时约为无损的 1/3。依赖 libwebp-sys（cc 编 C，无需 cmake）
webp = "0.3"
# 高清素材放大：xBRZ 1.8 的 Rust 移植（`scale_rgba`，像素画专用的边缘保持放大，倍率 1..=6）。
# 与 VCMI 引擎 `SDLImageShared::scale` 用的算法同款（引擎内为 C++ 版）。
# ⚠️ 许可证 **GPL-3.0-only**（继承自 xBRZ 原版）：引入即要求本产品以 GPL-3.0 兼容许可分发。
#    若不可接受，回退方案 = 只用 `image` crate 的 Lanczos3/CatmullRom（见 hd_bench 对比数据）。
# ⚠️ 该 crate 内部自带 rayon 并行，嵌套在我们的 rayon 池里调用时需评估线程争抢。
xbrz = { package = "xbrz-rs", version = "0.1" }
# 远程领域仓库：拉取索引 / 下载领域包。用 rustls 免 OpenSSL（Windows 打包更省事）。
# ⚠️ 网络代理仅支持 http(s)：reqwest 0.12/0.13 的 `socks` feature 已为空操作（内置 SOCKS 已移除），
#    socks5 无法经 reqwest::Proxy 走通；代理客户端（Clash/v2rayN）的 HTTP 混合端口已等效覆盖。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# 本地日志：tracing 生态。appender 提供「内存缓冲 + 后台线程定时落盘」，
# subscriber 负责时间/等级/目标格式化（`time` 提供 RFC3339 时间戳）。
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["time"] }
tracing-appender = "0.2"
# AI 超分（Real-ESRGAN）。
# ⚠️ `load-dynamic`：**运行时从外部 `onnxruntime.dll` 加载，不静态链进 exe**。
#    静态链接会把 ~30MB 的 ONNX Runtime 塞进 exe（10.7MB → 42.8MB），而版本更新是
#    「整包替换 exe」→ 每次更新都要重下这 30MB；外置后 DLL 常驻磁盘、不随更新变化。
#    附带好处：构建时不再下载 341MB 的 onnxruntime 静态库（`disable-linking`）。
#    运行库路径 = 外挂组件 `runtime::AI` 的约定目录 `<exe>/.vcmi-fv-launcher/runtime/ai/`。
#    `api-27` 需与随包 DLL 的 ONNX Runtime 版本（1.28）匹配，不要随意升降。
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "load-dynamic",
    "ndarray",
    "api-27",
] }
# 仅在加载 ORT 前"钉住" VC++ 运行库版本时用（见 `infra/ai.rs::pin_vc_runtime`）。
# ⚠️ 版本跟随 ort 的传递依赖（0.9.x），不要自行升降 —— 否则会多编译一份。
libloading = "0.9"

[features]
# 保留 Windows 控制台窗口（release 默认隐藏，便于看 stdout / stderr 日志）。
# 用法：`tauri build --features console`（见 package.json 的 build:console*）。
# ⚠️ 控制台开关**不要**再用 `debug_assertions` 间接判定 —— 见 src/main.rs 的说明。
console = []

[lib]
name = "vcmi_mod_launcher_lib"
# 桌面端只需 `rlib`：src/main.rs 只是 `vcmi_mod_launcher_lib::run()` 的薄壳，
# bin 直接链接 rlib。`staticlib` / `cdylib` 是 iOS / Android 目标用的，
# 桌面构建带上它们会额外链接一个 26MB 的 dll 并写出 1.17GB 的 .lib（纯浪费）。
# ⚠️ 若将来 `tauri android init` / `tauri ios init`，需要把这两项加回来。
crate-type = ["rlib"]

# ── 构建档位 ────────────────────────────────────────────────────────────────
# dev 档（`npm run dev:tauri` / `tauri build --debug`）：
#   依赖按 opt-level=2 编（依赖极少改动，编一次进缓存），自身代码保持 opt-level=1，
#   增量编译几乎无感；产物 ~61MB → ~18MB、PDB 597MB → 几十 MB、
#   写盘 ~2.2GB → ~300MB（链接末段反而更快），运行时也接近 release。
#   ⚠️ 第一次生效会触发依赖全量重编（十几分钟），之后长期受益。
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = false
